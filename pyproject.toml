[project]
name = "acl"
version = "0.1.0"
description = "Measurement-driven, issue-adaptive retrieval routing for repository-level code localization"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "polars", "networkx"]

[project.optional-dependencies]
dev = ["pytest"]
# Dense pass (acl.dense), run on a GPU node
dense = ["torch", "sentence-transformers", "einops"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
